<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="proteinGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="carbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="fatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.15" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3" />

  <!-- Background subtle glow -->
  <circle cx="256" cy="256" r="180" fill="url(#glowGrad)" filter="blur(24px)" />

  <!-- Macro Ring Gauge -->
  <!-- Track -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1e293b" stroke-width="26" stroke-linecap="round" />
  
  <!-- Protein Arc (130 deg) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#proteinGrad)" stroke-width="26"
    stroke-dasharray="360 1000" stroke-dashoffset="0" stroke-linecap="round" filter="url(#shadow)" />
    
  <!-- Carb Arc (110 deg) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#carbGrad)" stroke-width="26"
    stroke-dasharray="310 1000" stroke-dashoffset="-380" stroke-linecap="round" />

  <!-- Fat Arc (80 deg) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#fatGrad)" stroke-width="26"
    stroke-dasharray="230 1000" stroke-dashoffset="-710" stroke-linecap="round" />

  <!-- Central Dynamic "M" Fitness Symbol -->
  <g transform="translate(136, 146) scale(0.95)" filter="url(#shadow)">
    <!-- Stylized Fitness Energy / Lightning Bolt & M shape -->
    <path d="M 30 190 L 30 60 L 85 130 L 125 70 L 165 130 L 220 60 L 220 190" 
      fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Core Energy Dot -->
    <circle cx="125" cy="180" r="14" fill="#10b981" />
  </g>
</svg>
