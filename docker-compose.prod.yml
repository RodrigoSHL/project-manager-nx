services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-project_management_db}
      POSTGRES_USER: ${DATABASE_USERNAME:-project_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      USER_DATABASE_NAME: ${USER_DATABASE_NAME:-user_management_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-project_user} -d ${DATABASE_NAME:-project_management_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  project-api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        APP: project-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3002
      API_PREFIX: api
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-project_management_db}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-project_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      TYPEORM_SYNCHRONIZE: ${TYPEORM_SYNCHRONIZE:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://localhost:8081}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3002/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  user-api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        APP: user-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      USER_API_PORT: 3001
      API_PREFIX: api
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-project_management_db}
      USER_DATABASE_NAME: ${USER_DATABASE_NAME:-user_management_db}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-project_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      TYPEORM_SYNCHRONIZE: ${TYPEORM_SYNCHRONIZE:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://localhost:8081}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  bff-api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        APP: bff-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BFF_PORT: 3000
      PROJECT_API_URL: http://project-api:3002/api
      USER_API_URL: http://user-api:3001/api
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      BFF_CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://localhost:8081}
    depends_on:
      project-api:
        condition: service_healthy
      user-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  project-web:
    build:
      context: .
      dockerfile: Dockerfile.next
      args:
        APP: project-web
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
    depends_on:
      bff-api:
        condition: service_healthy

  jira-web:
    build:
      context: .
      dockerfile: Dockerfile.next
      args:
        APP: jira-web
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
    depends_on:
      bff-api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${JIRA_HTTP_PORT:-8081}:8081"
      - "${HTTPS_PORT:-443}:443"
    environment:
      PROJECT_WEB_HOST: ${PROJECT_WEB_HOST:-:80}
      JIRA_WEB_HOST: ${JIRA_WEB_HOST:-:8081}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      bff-api:
        condition: service_healthy
      project-web:
        condition: service_started
      jira-web:
        condition: service_started

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
