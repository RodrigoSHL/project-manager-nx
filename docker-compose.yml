services:
  postgres:
    image: postgres:15-alpine
    container_name: project_management_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-project_management_db}
      POSTGRES_USER: ${DATABASE_USERNAME:-user_project}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password_project}
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
      # Extra databases — the init script reads these to create them on first boot
      USER_DATABASE_NAME: ${USER_DATABASE_NAME:-user_management_db}
      TRAVEL_DB_NAME: ${TRAVEL_DB_NAME:-travel_planner_db}
      FILES_DB_NAME: ${FILES_DB_NAME:-files_db}
      INSPECTION_DB_NAME: ${INSPECTION_DB_NAME:-inspection_db}
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DATABASE_USERNAME:-user_project} -d ${DATABASE_NAME:-project_management_db}',
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  mailer-api:
    profiles: [mailer]
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        APP: mailer-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      MAILER_API_PORT: 3006
      API_PREFIX: api
      MAILER_PROVIDER: ${MAILER_PROVIDER:-noop}
      MAILER_SERVICE_TOKEN: ${MAILER_SERVICE_TOKEN:-}
      MAILER_FROM_EMAIL: ${MAILER_FROM_EMAIL:-onboarding@resend.dev}
      MAILER_FROM_NAME: ${MAILER_FROM_NAME:-Project Manager}
      MAILER_TIMEOUT_MS: ${MAILER_TIMEOUT_MS:-10000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3006/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    driver: local
